<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40">
  <defs>
    <clipPath id="front"><rect x="-10" y="20" width="60" height="30"/></clipPath>
    <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="40" height="40">
      <rect width="40" height="40" fill="#fff"/>
      <g transform="rotate(-20 20 20)">
        <ellipse cx="20" cy="20" rx="15.5" ry="5.5" fill="none" stroke="#000" stroke-width="6" clip-path="url(#front)"/>
      </g>
    </mask>
  </defs>
  <rect width="40" height="40" rx="10" fill="#0c0d0f"/>
  <circle cx="20" cy="20" r="9.6" fill="#f4f5f7" mask="url(#cut)"/>
  <ellipse cx="20" cy="20" rx="15.5" ry="5.5" transform="rotate(-20 20 20)" fill="none" stroke="#f4f5f7" stroke-width="2.6"/>
</svg>
